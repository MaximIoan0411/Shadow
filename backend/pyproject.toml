[project]
name = "shadow-backend"
version = "1.2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "asgi-lifespan>=2.1",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]          # fără el, pytest nu găsește pachetul `app` (proiectul uv nu e pachet instalat)

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = [
  "B008",      # Depends(...) în argumente: tiparul normal din FastAPI
  "ASYNC110",  # buclele din fundal cu asyncio.sleep sunt intenționate
  "E501",      # rânduri lungi: descrierile din contract sunt text; lățimea codului o ține `ruff format`
  "UP042",     # (str, Enum) în loc de StrEnum: păstrăm forma pe care o citește corect OpenAPI
]

[tool.ruff.lint.per-file-ignores]
"app/examples.py" = ["F403", "F405"]   # mock-ul importă toate modelele; dispare pe parcurs
