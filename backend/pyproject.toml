[project]
name = "shadow-backend"
version = "1.2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "asgi-lifespan>=2.1",
    "ruff>=0.6",
    "numpy>=2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]          # without it pytest cannot find the `app` package (the uv project is not installed)

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = [
  "B008",      # Depends(...) in arguments: the normal FastAPI pattern
  "ASYNC110",  # the background loops with asyncio.sleep are intended
  "E501",      # long lines: the contract descriptions are text; `ruff format` keeps the code width
  "UP042",     # (str, Enum) instead of StrEnum: the form OpenAPI reads correctly
]
